<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MINECRAFT 2D</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #72a7ff;
            font-family: Arial, sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
    </style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<div style="position:fixed;bottom:20px;left:20px;z-index:10;">
    <button id="leftBtn">◀</button>
    <button id="rightBtn">▶</button>
    <button id="jumpBtn">⬆</button>
</div>

<!-- سيبهم زي ما هم -->
<script src="physics.js"></script>
<script src="storage.js"></script>
<script src="game.js"></script>

<script>
    let moveL = false, moveR = false, moveJ = false;

    document.getElementById("leftBtn").onpointerdown = () => moveL = true;
    document.getElementById("leftBtn").onpointerup   = () => moveL = false;

    document.getElementById("rightBtn").onpointerdown = () => moveR = true;
    document.getElementById("rightBtn").onpointerup   = () => moveR = false;

    document.getElementById("jumpBtn").onpointerdown = () => moveJ = true;
    document.getElementById("jumpBtn").onpointerup   = () => moveJ = false;
</script>

</body>
</html>
